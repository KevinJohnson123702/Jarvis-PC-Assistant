<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jarvis Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<h1>🤖 Jarvis Dashboard</h1>


<div id="status">
Loading Jarvis...
</div>


<button onclick="getStatus()">
🔄 Refresh Status
</button>


<h2>Controls</h2>


<button onclick="calculator()">
🧮 Calculator
</button>


<button onclick="screenshot()">
📸 Screenshot
</button>


<button onclick="lockPC()">
🔒 Lock PC
</button>


<script>

const JARVIS_URL = "http://192.168.1.12:8000";


async function getStatus(){

    try {

        let response = await fetch(
            JARVIS_URL + "/status"
        );

        let data = await response.json();


        document.getElementById("status").innerHTML = `
            <h2>🟢 Jarvis Online</h2>

            <p>💻 Computer: ${data.computer}</p>
            <p>⚙️ CPU: ${data.cpu}%</p>
            <p>🧠 RAM: ${data.ram}%</p>
            <p>💾 Storage: ${data.storage}%</p>
        `;


    } catch(error){

        document.getElementById("status").innerHTML =
        "🔴 Jarvis Offline";

    }

}



async function calculator(){

    let response = await fetch(
        JARVIS_URL + "/calculator",
        {
            method:"POST"
        }
    );

    let data = await response.json();

    alert("🤖 " + data.status);

}



async function screenshot(){

    let response = await fetch(
        JARVIS_URL + "/screenshot",
        {
            method:"POST"
        }
    );

    let data = await response.json();

    alert("🤖 " + data.status);

}



async function lockPC(){

    let response = await fetch(
        JARVIS_URL + "/lock",
        {
            method:"POST"
        }
    );

    let data = await response.json();

    alert("🤖 " + data.status);

}



getStatus();

</script>


</body>

</html>
