<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🤖 Jarvis Dashboard</h1>

<div id="status">
    Loading Jarvis...
</div>

<button onclick="getStatus()">
    🔄 Refresh Status
</button>

<h2>Controls</h2>

<button onclick="command('calculator')">
    🧮 Calculator
</button>

<button onclick="command('screenshot')">
    📸 Screenshot
</button>

<button onclick="command('lock')">
    🔒 Lock PC
</button>

<button onclick="command('restart')">
    🔄 Restart PC
</button>

<button onclick="command('shutdown')">
    ⏻ Shutdown PC
</button>

<script src="app.js"></script>

</body>

</html>
