<!DOCTYPE html>
<html>
<head>
<title>Jarvis Test</title>
</head>

<body>

<h1>🤖 Jarvis Test Dashboard</h1>

<button onclick="testButton()">
🧪 Test Button
</button>

<button onclick="command('calculator')">
🧮 Calculator
</button>

<script>

const JARVIS_URL = "http://192.168.1.12:8000";

function testButton(){
    alert("Button works!");
}


async function command(action){

    alert("Sending: " + action);

    const response = await fetch(
        `${JARVIS_URL}/${action}`,
        {
            method:"POST"
        }
    );

    const data = await response.json();

    alert(data.status);
}

</script>

</body>
</html>
