<!DOCTYPE html>
<html>
<head>
    <title>Jarvis Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<h1>🤖 Jarvis Test</h1>

<button onclick="testButton()">
🧪 Test Button
</button>

<br><br>

<button onclick="calculator()">
🧮 Calculator
</button>


<script>

const JARVIS_URL = "http://192.168.1.12:8000";


function testButton(){
    alert("Button works!");
}


async function calculator(){

    alert("Sending calculator command...");

    try {

        let response = await fetch(
            JARVIS_URL + "/calculator",
            {
                method: "POST"
            }
        );


        alert("Server replied!");


        let data = await response.json();


        alert("🤖 Jarvis: " + data.status);


    } catch(error) {

        alert("🔴 ERROR: " + error);

    }
}

</script>

</body>
</html>
